<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fazer meu palpite · Survivor</title>
<meta name="theme-color" content="#300A62">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
/* ======= CONFIGURAÇÃO ======= */
const API = "https://script.google.com/macros/s/AKfycbwVVHYPEs0OFH4y7IJV11tpG2Z9xqpEXSazrFdnWJoJSmvzzs5vEoU7tnXpq1aXCopo/exec";   // termina em /exec
const PLACAR = "https://survivor2026.github.io/survivor/";
</script>
<style>
:root{--bg:#F2F0F5;--deep:#300A62;--card:#3E1478;--yel:#FACC15;--lav:#E2D6FC;--foot:#5F5573;--green:#86EFAC;--red:#B42318;--line:#D6CDE4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--deep);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
main{max-width:440px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:16px}
a{color:var(--deep)}
h1{font-family:"Permanent Marker",Poppins,sans-serif;font-weight:400;font-size:34px;line-height:1.1}
.under{width:100px;height:6px;border-radius:3px;background:var(--yel)}
.center{align-items:center;text-align:center}
.logo{width:92px;height:92px;display:block}
.top{display:flex;align-items:center;gap:10px}
.top img{width:46px;height:46px}
.top .t{font-family:"Permanent Marker",Poppins,sans-serif;font-size:20px;flex:1}
.rpill{background:var(--deep);color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:5px 12px}
.back{font-weight:700;font-size:15px;text-decoration:none;padding:6px 0;align-self:flex-start;background:none;border:0;color:var(--deep);cursor:pointer;font-family:inherit}
.lead{font-size:15px;font-weight:600;color:var(--card)}
.card{background:var(--card);color:#fff;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;width:100%}
.card .ttl{font-weight:700;font-size:18px}
.card .txt{font-size:13.5px;font-weight:600;color:var(--lav)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--yel);color:var(--deep);font:700 17px Poppins,system-ui,sans-serif;border-radius:14px;padding:15px;border:0;cursor:pointer}
.btn.out{background:transparent;border:2px solid var(--card);padding:13px}
.card .btn.out{color:#fff;border-color:var(--lav)}
.btn:disabled{opacity:.55;cursor:wait}
.btn:focus-visible,.team:focus-visible,input:focus-visible,.back:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.div{width:100%;display:flex;align-items:center;gap:10px;color:var(--foot);font-size:13px;font-weight:700}
.div::before,.div::after{content:"";flex:1;height:1px;background:var(--line)}
.fld{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
label,.lbl{font-size:14px;font-weight:700;color:var(--card)}
.inp{width:100%;height:52px;border-radius:14px;border:2px solid var(--card);background:#fff;color:var(--deep);font:600 18px Poppins,system-ui,sans-serif;padding:0 14px}
.inp.code{font-weight:700;font-size:20px;letter-spacing:6px;text-transform:uppercase}
.pin{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pin span{height:54px;border-radius:14px;border:2px solid var(--card);background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
.pin span.cur{border-color:var(--yel);box-shadow:0 0 0 2px var(--yel)}
.pin input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;caret-color:transparent}
.remember{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--green);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left}
.remember input{width:24px;height:24px;accent-color:#15803D;flex:none}
.remember b{display:block;font-size:16px}
.remember small{display:block;font-size:12.5px;font-weight:600;color:var(--foot)}
.foot{font-size:12.5px;color:var(--foot);font-weight:600;text-align:center}
.err{background:#FEE4E2;color:var(--red);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;width:100%;text-align:left}
.err:empty{display:none}
.ok{color:var(--green);font-size:13px;font-weight:700}
.hello{font-family:"Permanent Marker",Poppins,sans-serif;font-size:26px;line-height:1.2;color:var(--yel)}
.mode{background:#FFF7D6;border:1.5px solid #E9C33A;color:#5C4400;border-radius:14px;padding:10px 14px;font-size:13.5px;font-weight:600}
.mode b{font-weight:700}
.ent .h{display:flex;align-items:center;gap:8px}
.ent .h .n{font-weight:700;font-size:20px;flex:1}
.pill{font-weight:700;font-size:12px;border-radius:999px;padding:4px 10px}
.pill.v{background:var(--yel);color:var(--deep)}
.pill.e{border:1px solid #FF8A8A;color:#FF8A8A;padding:3px 9px}
.ent .st{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;gap:10px}
.ent .st span:first-child{color:var(--lav);font-weight:600}
.ent .st span:last-child{font-weight:700;text-align:right}
.ent.dead{opacity:.6}
.links{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:auto}
.links a,.links button{font-weight:700;font-size:15px;padding:10px;background:none;border:0;color:var(--deep);font-family:inherit;cursor:pointer;text-decoration:underline}
.links .sm{font-size:13.5px;color:var(--foot);font-weight:600}
.usedbar{background:var(--card);color:var(--lav);border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.usedbar b{color:#fff}
.chip{background:rgba(226,214,252,.18);color:#fff;border-radius:999px;padding:2px 10px;font-weight:700}
.usedbar .free{margin-left:auto;color:var(--green);font-weight:700}
.games{background:#fff;border-radius:16px;border:1px solid #E2DAF0;padding:4px 10px}
.g{display:grid;grid-template-columns:66px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #EEE9F5}
.g:last-child{border-bottom:0}
.g .w{display:flex;flex-direction:column;line-height:1.25}
.g .w b{font-size:11.5px;color:var(--foot);white-space:nowrap}
.g .w span{font-size:14px;font-weight:700}
.team{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;background:#F7F4FB;border:2px solid var(--card);color:var(--deep);font:700 14px Poppins,system-ui,sans-serif;border-radius:12px;padding:6px 4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team.sel{background:var(--yel);border-color:var(--yel)}
.team.sel small{font-size:10.5px}
.team.used{background:#E9E5EF;border-color:#E9E5EF;color:var(--foot);font-weight:600;font-size:13.5px;cursor:not-allowed}
.team.used s{text-decoration-thickness:1.5px}
.team small{font-size:10.5px;font-weight:700;text-decoration:none}
.vs{background:var(--card);color:#fff;border-radius:18px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.vs .k{font-size:13px;font-weight:700;color:var(--lav);letter-spacing:.4px}
.vs .pick{font-family:"Permanent Marker",Poppins,sans-serif;font-size:36px;color:var(--yel);line-height:1.15}
.vs .opp{font-size:15px;font-weight:600;color:var(--lav)}
.big{font-size:56px;line-height:1}
.spin{margin:auto;width:42px;height:42px;border-radius:50%;border:4px solid var(--lav);border-top-color:var(--card);animation:r 0.9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>

";
const SHORT = {"Red Bull Bragantino":"Bragantino"};
const sh = t => SHORT[t] || t;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const app = $("#app");

// ---------- sessão guardada no aparelho ----------
const store = {
  get(){ try{ return localStorage.getItem("sv_sessao") || sessionStorage.getItem("sv_sessao") }catch(e){ return null } },
  set(t, lembrar){ try{ (lembrar ? localStorage : sessionStorage).setItem("sv_sessao", t) }catch(e){} },
  clear(){ try{ localStorage.removeItem("sv_sessao"); sessionStorage.removeItem("sv_sessao") }catch(e){} }
};
let S = { sessao: store.get(), dados: null, codigo: "", lembrar: true };

async function api(acao, corpo = {}){
  if (API.startsWith("COLE")) throw new Error("O link do App da Web ainda não foi colado no palpite.html.");
  let r;
  try{
    r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ acao, ...corpo }) });
  }catch(e){ throw new Error("Sem conexão. Confira a internet e tente de novo.") }
  if (!r.ok) throw new Error("O servidor não respondeu (" + r.status + "). Tente de novo.");
  const j = await r.json();
  if (j.sair){ store.clear(); S.sessao = null }
  if (!j.ok) throw new Error(j.erro || "Algo deu errado.");
  return j;
}

function ocupado(btn, sim, txt){
  if (!btn) return;
  if (sim){ btn.dataset.t = btn.textContent; btn.textContent = txt || "Aguarde…"; btn.disabled = true }
  else { btn.textContent = btn.dataset.t || btn.textContent; btn.disabled = false }
}
function erro(msg){ const e = $(".err"); if (e){ e.textContent = msg; e.scrollIntoView({ block: "nearest" }) } }
function ir(fn, ...a){ fn(...a); window.scrollTo(0, 0); const f = app.querySelector("[autofocus]"); if (f) f.focus() }

// ---------- campo de PIN (4 caixinhas, um campo real por baixo) ----------
function pinHTML(id, rotulo){
  return `<div class="fld"><label for="${id}">${rotulo}</label><div class="pin" data-for="${id}"><span></span><span></span><span></span><span></span>
  <input id="${id}" type="tel" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="${rotulo}, 4 números"></div></div>`;
}
function ligarPins(aoCompletar){
  app.querySelectorAll(".pin").forEach(box => {
    const inp = box.querySelector("input"), sp = box.querySelectorAll("span");
    const pinta = () => { const v = inp.value; sp.forEach((s, i) => { s.textContent = v[i] ? "•" : ""; s.classList.toggle("cur", document.activeElement === inp && i === Math.min(v.length, 3)) }) };
    inp.addEventListener("input", () => { inp.value = inp.value.replace(/\D/g, "").slice(0, 4); pinta(); if (inp.value.length === 4 && aoCompletar) aoCompletar(inp) });
    inp.addEventListener("focus", pinta); inp.addEventListener("blur", pinta); pinta();
  });
}
function mascaraCel(v){
  const d = v.replace(/\D/g, "").replace(/^55(?=\d{10,11}$)/, "").slice(0, 11);
  if (d.length <= 2) return d.length ? "(" + d : "";
  if (d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
const lembrarHTML = () => `<label class="remember"><input type="checkbox" id="lembrar" ${S.lembrar ? "checked" : ""}><span><b>Lembrar neste dispositivo</b><small>Na próxima vez você entra direto, sem PIN</small></span></label>`;

// ================= TELA: Entrar =================
function telaEntrar(){
  app.className = "center";
  app.innerHTML = `
  <img class="logo" alt="Survivor Brasileirão" src="${LOGO}">
  <h1>Fazer meu palpite</h1><div class="under"></div>
  <div class="card" style="text-align:left">
    <div><div class="ttl">Primeira vez aqui?</div><div class="txt">Use o código que você recebeu no WhatsApp para ativar seu acesso.</div></div>
    <button class="btn" type="button" id="bAtivar">Tenho um código de ativação</button>
  </div>
  <div class="div">Já tenho PIN</div>
  <div class="fld"><label for="cel">Seu número de celular</label>
    <input class="inp" id="cel" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(11) 90000-0000"></div>
  ${pinHTML("pin", "Seu PIN")}
  ${lembrarHTML()}
  <p class="err" role="alert"></p>
  <button class="btn out" type="button" id="bEntrar">Entrar</button>
  <p class="foot">Esqueceu o PIN? Peça um código novo à organização.</p>`;
  const cel = $("#cel");
  try{ cel.value = localStorage.getItem("sv_cel") || "" }catch(e){}
  cel.addEventListener("input", () => { cel.value = mascaraCel(cel.value) });
  $("#bAtivar").onclick = () => ir(telaAtivar);
  const entrar = async () => {
    const b = $("#bEntrar"), pin = $("#pin").value, lembrar = $("#lembrar").checked;
    S.lembrar = lembrar;
    if (cel.value.replace(/\D/g, "").length < 10) return erro("Digite o celular com DDD.");
    if (pin.length !== 4) return erro("Digite os 4 números do PIN.");
    ocupado(b, true, "Entrando…");
    try{
      const j = await api("entrar", { celular: cel.value, pin, lembrar });
      try{ localStorage.setItem("sv_cel", cel.value) }catch(e){}
      S.sessao = j.sessao; store.set(j.sessao, lembrar);
      await carregar();
    }catch(e){ ocupado(b, false); $("#pin").value = ""; $("#pin").dispatchEvent(new Event("input")); erro(e.message) }
  };
  $("#bEntrar").onclick = entrar;
  ligarPins(() => { if (cel.value.replace(/\D/g, "").length >= 10) entrar() });
}

// ================= TELA: Primeiro acesso =================
function telaAtivar(){
  app.className = "";
  app.innerHTML = `
  <button class="back" type="button" id="bVoltar">‹ Voltar</button>
  <div style="display:flex;flex-direction:column;gap:6px"><h1>Primeiro acesso</h1><div class="under"></div></div>
  <div class="fld"><label for="cod">Código que você recebeu no WhatsApp</label>
    <input class="inp code" id="cod" type="text" autocapitalize="characters" autocomplete="one-time-code" maxlength="6" spellcheck="false" autofocus value="${esc(S.codigo)}"></div>
  <div id="quem"></div>
  <p class="err" role="alert"></p>`;
  $("#bVoltar").onclick = () => ir(telaEntrar);
  const cod = $("#cod");
  let ultimo = "";
  const confere = async () => {
    const c = cod.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    cod.value = c; erro("");
    if (c.length < 6){ $("#quem").innerHTML = ""; ultimo = ""; return }
    if (c === ultimo) return; ultimo = c;
    $("#quem").innerHTML = `<div class="spin" style="width:30px;height:30px;margin:6px auto"></div>`;
    try{
      const j = await api("codigo", { codigo: c });
      S.codigo = c;
      $("#quem").innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card" style="gap:4px"><div class="ok">Código reconhecido</div><div class="hello">Oi, ${esc(j.nome)}!</div>
          <div class="txt">Seu login será o número ${esc(j.celular)}</div>
          <div class="txt" style="font-size:12.5px">Não é você? Fale com a organização.</div></div>
        ${pinHTML("p1", "Crie seu PIN de 4 números")}
        ${pinHTML("p2", "Repita o PIN")}
        ${lembrarHTML()}
        <button class="btn" type="button" id="bAtivar">Ativar e entrar</button>
        <p class="foot">O código vale uma vez só. Depois, é só seu número e PIN.</p>
      </div>`;
      ligarPins(inp => { if (inp.id === "p1") $("#p2").focus() });
      $("#p1").focus();
      $("#bAtivar").onclick = async () => {
        const b = $("#bAtivar"), p1 = $("#p1").value, p2 = $("#p2").value, lembrar = $("#lembrar").checked;
        if (p1.length !== 4) return erro("O PIN precisa ter 4 números.");
        if (p1 !== p2) return erro("Os dois PINs não são iguais. Digite de novo.");
        ocupado(b, true, "Ativando…");
        try{
          const r = await api("ativar", { codigo: c, pin: p1, lembrar });
          S.sessao = r.sessao; S.codigo = ""; store.set(r.sessao, lembrar);
          try{ localStorage.setItem("sv_cel", "") }catch(e){}
          await carregar();
        }catch(e){ ocupado(b, false); erro(e.message) }
      };
    }catch(e){ $("#quem").innerHTML = ""; ultimo = ""; erro(e.message) }
  };
  cod.addEventListener("input", confere);
  if (S.codigo) confere();
}

// ================= TELA: Minhas entradas =================
async function carregar(){
  app.className = ""; app.innerHTML = `<div class="spin" role="status" aria-label="Carregando"></div>`;
  try{ S.dados = await api("estado", { sessao: S.sessao }); ir(telaMain) }
  catch(e){ if (!S.sessao){ ir(telaEntrar); erro(e.message) } else { app.innerHTML = `<p class="err" role="alert">${esc(e.message)}</p><button class="btn" type="button" onclick="carregar()">Tentar de novo</button>` } }
}
function topo(){
  const r = S.dados.rodada;
  return `<div class="top"><img alt="" src="${LOGO}"><div class="t">Survivor Brasileirão</div>${r ? `<div class="rpill">R${r.n}</div>` : ""}</div>`;
}
function avisoModo(){
  return S.dados.modo === "Valendo" ? "" :
    `<div class="mode"><b>Modo teste.</b> Por enquanto o palpite feito aqui ainda não vale. Continue mandando pelo WhatsApp também.</div>`;
}
function telaMain(){
  const d = S.dados, r = d.rodada;
  const vivas = d.entradas.filter(e => e.viva), mortas = d.entradas.filter(e => !e.viva);
  const card = e => {
    if (!e.viva) return `<div class="card ent dead"><div class="h"><div class="n">${esc(e.entrada)}</div><span class="pill e">Caiu</span>${e.elimR ? `<span class="pill e">R${e.elimR}</span>` : ""}</div></div>`;
    const st = !r ? `<span>Sem rodada aberta</span><span></span>` :
      e.palpite ? `<span>Palpite da R${r.n}</span><span style="color:var(--green)">${esc(sh(e.palpite))} · enviado</span>` :
      `<span>Palpite da R${r.n}</span><span>Pendente</span>`;
    const bt = r ? `<button class="btn${e.palpite ? " out" : ""}" type="button" data-e="${esc(e.entrada)}">${e.palpite ? "Alterar palpite" : "Fazer palpite"}</button>` : "";
    return `<div class="card ent"><div class="h"><div class="n">${esc(e.entrada)}</div><span class="pill v">Vivo</span></div><div class="st">${st}</div>${bt}</div>`;
  };
  app.innerHTML = `${topo()}
  <div style="display:flex;flex-direction:column;gap:6px;padding-top:4px"><h1 style="font-size:38px">Oi, ${esc(d.primeiroNome)}</h1><div class="under" style="width:110px"></div>
    <p class="lead" style="margin-top:6px">${r ? `Palpites da Rodada ${r.n} até ${esc(r.prazo)}` : "A próxima rodada ainda não abriu para palpites. Volte depois que ela for aberta."}</p></div>
  ${r ? avisoModo() : ""}
  ${d.entradas.length ? vivas.map(card).join("") + mortas.map(card).join("") : `<p class="err">Não encontrei entradas no seu nome. Fale com a organização.</p>`}
  <div class="links"><a href="${PLACAR}">Ver o placar geral do Survivor</a><button class="sm" type="button" id="bSair">Não é você? Sair deste dispositivo</button></div>`;
  app.querySelectorAll("[data-e]").forEach(b => b.onclick = () => ir(telaEscolher, b.dataset.e));
  $("#bSair").onclick = async () => { const t = S.sessao; store.clear(); S.sessao = null; S.dados = null; ir(telaEntrar); try{ await api("sair", { sessao: t }) }catch(e){} };
}

// ================= TELA: Escolher o time =================
function telaEscolher(nome){
  const d = S.dados, r = d.rodada, e = d.entradas.find(x => x.entrada === nome);
  const usado = {}; e.usados.forEach(u => usado[u.time] = u.rodada);
  const livres = 20 - Object.keys(usado).length;
  const bt = t => usado[t]
    ? `<span class="team used" aria-label="${esc(t)}, já usado na ${usado[t]}"><s>${esc(sh(t))}</s><small>usado na ${usado[t]}</small></span>`
    : `<button class="team${e.palpite === t ? " sel" : ""}" type="button" data-t="${esc(t)}">${esc(sh(t))}${e.palpite === t ? "<small>palpite atual</small>" : ""}</button>`;
  app.innerHTML = `
  <button class="back" type="button" id="bVoltar">‹ Minhas entradas</button>
  <div style="display:flex;flex-direction:column;gap:6px"><h1>${esc(e.entrada)}</h1><div class="under"></div>
    <p class="lead" style="margin-top:6px">Toque no time que vai vencer na Rodada ${r.n}</p></div>
  <div class="usedbar"><b>Já usados</b>${e.usados.length ? e.usados.map(u => `<span class="chip">${esc(sh(u.time))}</span>`).join("") : "<span>nenhum ainda</span>"}<span class="free">${livres} livres</span></div>
  <div class="games">${r.jogos.map(j => `<div class="g"><div class="w"><b>${esc(j.dia)}</b><span>${esc(j.hora)}</span></div>${bt(j.casa)}${bt(j.fora)}</div>`).join("")}</div>
  <p class="foot">Times que você já usou ficam bloqueados. Prazo ${esc(r.prazo)}.</p>`;
  $("#bVoltar").onclick = () => ir(telaMain);
  app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => ir(telaConfirmar, nome, b.dataset.t));
}

// ================= TELA: Confirmar =================
function telaConfirmar(nome, time){
  const r = S.dados.rodada, j = r.jogos.find(x => x.casa === time || x.fora === time);
  const casa = j.casa === time, adv = casa ? j.fora : j.casa;
  const e = S.dados.entradas.find(x => x.entrada === nome);
  app.innerHTML = `
  <button class="back" type="button" id="bVoltar">‹ Escolher outro time</button>
  <div style="display:flex;flex-direction:column;gap:6px"><h1>Confirmar palpite</h1><div class="under"></div></div>
  <div class="vs"><div class="k">${esc(e.entrada.toUpperCase())} · RODADA ${r.n}</div><div class="pick">${esc(sh(time))}</div>
    <div class="opp">${casa ? "em casa contra" : "fora contra"} ${esc(sh(adv))}</div><div class="opp">${esc(j.dia)} às ${esc(j.hora)}</div></div>
  ${e.palpite ? `<p class="lead" style="text-align:center">Isso troca o palpite atual (${esc(sh(e.palpite))}).</p>` : ""}
  <p class="lead" style="text-align:center">Se ${esc(sh(time))} empatar ou perder, ${esc(e.entrada)} está fora.</p>
  <p class="err" role="alert"></p>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <button class="btn" type="button" id="bOk">Confirmar ${esc(sh(time))}</button>
    <button class="btn out" type="button" id="bNao">Voltar</button></div>`;
  $("#bVoltar").onclick = $("#bNao").onclick = () => ir(telaEscolher, nome);
  $("#bOk").onclick = async () => {
    const b = $("#bOk"); ocupado(b, true, "Enviando…");
    try{
      const res = await api("palpitar", { sessao: S.sessao, entrada: nome, time });
      e.palpite = time;
      ir(telaPronto, res);
      api("estado", { sessao: S.sessao }).then(x => { S.dados = x }).catch(() => {});
    }catch(err){ ocupado(b, false); erro(err.message); if (!S.sessao) setTimeout(() => ir(telaEntrar), 1500) }
  };
}

// ================= TELA: Pronto =================
function telaPronto(res){
  app.className = "center";
  app.innerHTML = `
  <div style="margin-top:28px" class="big" aria-hidden="true">✅</div>
  <h1>Palpite registrado!</h1><div class="under"></div>
  <div class="vs" style="width:100%"><div class="k">${esc(res.entrada.toUpperCase())} · RODADA ${res.rodada}</div><div class="pick">${esc(sh(res.time))}</div></div>
  <p class="lead">Dá para trocar até ${esc(res.prazo)}.</p>
  ${res.modo === "Valendo" ? "" : `<div class="mode" style="text-align:left"><b>Modo teste.</b> Este palpite ainda não vale. Mande também pelo WhatsApp.</div>`}
  <div style="margin-top:auto;width:100%;display:flex;flex-direction:column;gap:10px">
    <button class="btn" type="button" id="bVolta">Voltar para minhas entradas</button>
    <a class="btn out" href="${PLACAR}">Ver o placar geral</a></div>`;
  $("#bVolta").onclick = () => ir(telaMain);
}

// ---------- início ----------
if (S.sessao) carregar(); else ir(telaEntrar);
</script>
</body>
</html>
